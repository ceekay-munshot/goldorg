name: Update Gold ETF Data

on:
  schedule:
    # Daily at 06:00 UTC — gold.org typically refreshes the monthly XLSX
    # in the first week of each month. Daily polling is cheap and resilient.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: update-data
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest XLSX from gold.org
        id: fetch
        run: python scripts/fetch.py

      - name: Parse XLSX to JSON
        run: python scripts/parse.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          # Build a descriptive commit message from the metadata
          AS_OF=$(python -c "import json; print(json.load(open('data/parsed/metadata.json'))['as_of_date'])")
          SRC=$(python -c "import json; print(json.load(open('data/parsed/metadata.json'))['source_file'])")
          git commit -m "data: refresh ETF flows (as of ${AS_OF}, src ${SRC})"
          git push
