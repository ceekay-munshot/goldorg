name: Update Gold ETF Data

on:
  schedule:
    # Daily at 06:00 UTC — gold.org typically refreshes the monthly XLSX
    # in the first week of each month. Daily polling is cheap and resilient.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: update-data
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest ETF flows XLSX from gold.org
        id: fetch
        run: python scripts/fetch.py

      - name: Parse ETF flows XLSX to JSON
        run: python scripts/parse.py

      - name: Fetch WGC Gold Demand Trends XLSX
        # Soft-fail: a hiccup on the demand pipeline shouldn't kill the
        # ETF refresh (the dashboard's primary data source).
        continue-on-error: true
        run: python scripts/fetch_demand.py

      - name: Parse Demand Trends XLSX to JSON
        continue-on-error: true
        run: python scripts/parse_demand.py

      - name: Fetch CFTC COT (COMEX gold) via Socrata
        continue-on-error: true
        run: python scripts/fetch_cot.py

      - name: Fetch macro series from FRED
        continue-on-error: true
        run: python scripts/fetch_macros.py

      - name: Build OLS forecast (gold returns vs macros)
        continue-on-error: true
        run: python scripts/build_forecast.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          # Build a descriptive commit message from the metadata
          AS_OF=$(python -c "import json; print(json.load(open('data/parsed/metadata.json'))['as_of_date'])")
          SRC=$(python -c "import json; print(json.load(open('data/parsed/metadata.json'))['source_file'])")
          DEMAND_Q=$(python -c "import json; d=json.load(open('data/parsed/demand.json')); print(d.get('as_of_quarter') or 'none')" 2>/dev/null || echo "none")
          COT_DATE=$(python -c "import json; c=json.load(open('data/parsed/cot.json')); print(c.get('as_of_date') or 'none')" 2>/dev/null || echo "none")
          FCST=$(python -c "import json; f=json.load(open('data/parsed/forecast.json')); print(f.get('r_squared') or 'none')" 2>/dev/null || echo "none")
          git commit -m "data: refresh (ETF ${AS_OF}, demand ${DEMAND_Q}, cot ${COT_DATE}, forecast R²=${FCST})"
          git push
